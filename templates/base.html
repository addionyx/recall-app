<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Nutrition App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-block">
        <h1 class="app-title">Nutrition App</h1>
        <p class="app-subtitle">Diet recall and weekly intake pages</p>
      </div>

      <nav class="top-nav">
        <a href="{{ url_for('recall24') }}" class="nav-link">24 Hour Recall</a>
        <a href="{{ url_for('weekly_frequency') }}" class="nav-link">Weekly Frequency</a>
      </nav>
    </header>

    <main class="page-wrapper">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
